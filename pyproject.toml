[project]
name = "ngeo-sistema-alerta-incendio"
version = "0.1.0"
description = "Sistema de Alerta de Incêndio Florestal (NGEO / IDEFLOR-Bio)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "PTH"]
ignore = ["PTH123", "PTH118", "PTH120", "PTH103", "PTH110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
