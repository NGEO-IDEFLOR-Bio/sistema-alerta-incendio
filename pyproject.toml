[project]
name = "ngeo-sistema-alerta-incendio"
version = "0.1.0"
description = "Sistema de Alerta de Incêndio Florestal (NGEO / IDEFLOR-Bio)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "geoalchemy2>=0.15",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "shapely>=2.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = { "" = "backend/src" }

[tool.setuptools.packages.find]
where = ["backend/src"]
include = ["ngeo*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "frontend", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "PTH"]
ignore = ["PTH123", "PTH118", "PTH120", "PTH103", "PTH110"]

[tool.ruff.lint.per-file-ignores]
# Os scripts de seed são CLIs: sys.path precisa do backend/src antes do import.
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend/src"]
addopts = "-q"
markers = [
    "banco: precisa do Postgres local (docker compose up -d)",
]
